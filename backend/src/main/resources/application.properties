spring.application.name=pedija

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedija}
spring.datasource.username=${DB_USERNAME:pedija12}
spring.datasource.password=${DB_PASSWORD:pedija123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.cors.origins=${CORS_ORIGINS:http://localhost:5173}
security.registration.enabled=${REGISTRATION_ENABLED:false}
